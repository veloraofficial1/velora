<section class="payment-section" id="paymentSection">

    <div class="payment-box">

        <h2>💳 Ödeme</h2>

        <p id="paymentTotal" style="margin-bottom:25px;"></p>

        <div class="form-group">
            <label>Kart Üzerindeki İsim</label>
            <input
                type="text"
                id="cardName"
                placeholder="Ad Soyad"
                autocomplete="off"
            >
        </div>

        <div class="form-group">
            <label>Kart Numarası</label>
            <input
                type="text"
                id="cardNumber"
                placeholder="0000 0000 0000 0000"
                maxlength="19"
                inputmode="numeric"
                autocomplete="off"
            >
        </div>

        <div style="display:flex; gap:12px;">

            <div class="form-group" style="flex:1;">
                <label>Son Kullanma</label>
                <input
                    type="text"
                    id="cardExpiry"
                    placeholder="AA/YY"
                    maxlength="5"
                    autocomplete="off"
                >
            </div>

            <div class="form-group" style="flex:1;">
                <label>CVV</label>
                <input
                    type="password"
                    id="cardCvv"
                    placeholder="123"
                    maxlength="4"
                    inputmode="numeric"
                    autocomplete="off"
                >
            </div>

        </div>

        <button
            class="payment-button"
            onclick="makeTestPayment()">
            Ödemeyi Tamamla
        </button>

        <p style="margin-top:15px;color:#777;font-size:13px;">
            Test ödeme ekranıdır. Gerçek kart bilgisi kullanmayın.
        </p>

    </div>

</section>
