<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELORA | Zarafetin Modern Hali</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Montserrat", sans-serif;
    background: #faf8f4;
    color: #3e3934;
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(250,248,244,0.97);
    border-bottom: 1px solid #e8e0d5;
    padding: 18px 5%;
}

.header-inner {
    max-width: 1250px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-family: "Cormorant Garamond", serif;
    font-size: 38px;
    letter-spacing: 6px;
    color: #9b7743;
    font-weight: 600;
}

nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

.nav-item {
    position: relative;
}

.nav-link {
    border: none;
    background: none;
    color: #403a34;
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    letter-spacing: 1px;
    cursor: pointer;
    padding: 10px 2px;
}

.nav-link:hover {
    color: #a27d46;
}

/* DROPDOWN */
.dropdown {
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    width: 210px;
    background: #fffdf9;
    border: 1px solid #e9e0d4;
    box-shadow: 0 15px 35px rgba(60,45,30,0.10);
    padding: 12px 0;
    opacity: 0;
    visibility: hidden;
    transition: 0.25s ease;
}

.nav-item:hover .dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0);
}

.dropdown button {
    width: 100%;
    padding: 11px 18px;
    border: none;
    background: transparent;
    text-align: left;
    font-family: "Montserrat", sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: #554d45;
    cursor: pointer;
}

.dropdown button:hover {
    background: #f5efe7;
    color: #9b7743;
}

.cart-nav {
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    color: #9b7743;
    text-decoration: none;
    padding: 10px;
}

/* HERO */
.hero {
    min-height: 550px;
    background:
        linear-gradient(rgba(50,40,30,0.22), rgba(50,40,30,0.22)),
        url("resimler/urun1.jpg") center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 50px 20px;
}

.hero-content {
    color: white;
}

.hero h1 {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(50px, 8vw, 90px);
    font-weight: 500;
    letter-spacing: 10px;
    margin-bottom: 10px;
}

.hero p {
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    letter-spacing: 2px;
}

/* CATEGORIES */
.categories {
    padding: 80px 5% 40px;
    max-width: 1300px;
    margin: auto;
}

.section-title {
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 46px;
    font-weight: 500;
    color: #8e6c3f;
    margin-bottom: 45px;
}

.category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.category-card {
    height: 300px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #eee7de;
}

.category-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
}

.category-card:hover img {
    transform: scale(1.06);
}

.category-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to top,
        rgba(30,22,15,0.65),
        rgba(30,22,15,0.05)
    );
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 25px;
}

.category-overlay h3 {
    color: white;
    font-family: "Cormorant Garamond", serif;
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 2px;
}

/* PRODUCTS */
.products-section {
    max-width: 1300px;
    margin: auto;
    padding: 60px 5% 100px;
}

.category-heading {
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 40px;
    color: #8e6c3f;
    margin: 60px 0 30px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
}

.product-card {
    background: #fffdf9;
    border: 1px solid #e9e0d5;
    overflow: hidden;
    transition: 0.3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 30px rgba(70,50,30,0.08);
}

.product-image {
    width: 100%;
    height: 330px;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 22px;
    text-align: center;
}

.product-name {
    font-family: "Cormorant Garamond", serif;
    font-size: 28px;
    font-weight: 500;
    color: #4c433b;
}

.product-category {
    margin-top: 5px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #a78c69;
    text-transform: uppercase;
}

.stock-status {
    margin: 15px 0;
    font-size: 13px;
    letter-spacing: 1px;
    color: #9b7743;
    font-weight: 500;
}

.stock-button {
    width: 100%;
    border: 1px solid #d9cbb9;
    background: #f2ede6;
    color: #9c8b76;
    padding: 12px;
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
    cursor: not-allowed;
}

/* REVIEWS */
.review-box {
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eee5da;
}

.stars {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 12px;
}

.star {
    font-size: 21px;
    color: #d7c7af;
    cursor: pointer;
    transition: 0.2s;
}

.star.active {
    color: #b28b54;
}

.review-input {
    width: 100%;
    border: 1px solid #ddd3c6;
    padding: 10px;
    resize: vertical;
    min-height: 70px;
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
    background: #fff;
    outline: none;
}

.review-input:focus {
    border-color: #b89a70;
}

.review-button {
    margin-top: 8px;
    border: 1px solid #b89a70;
    background: transparent;
    color: #8e6c3f;
    padding: 9px 18px;
    cursor: pointer;
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
}

.review-button:hover {
    background: #b89a70;
    color: white;
}

.reviews {
    margin-top: 15px;
    text-align: left;
}

.review {
    background: #f8f4ee;
    padding: 10px;
    margin-top: 7px;
    font-size: 12px;
}

.review-stars {
    color: #b28b54;
    margin-bottom: 4px;
}

/* FOOTER */
footer {
    background: #302a25;
    color: #e9dfd2;
    text-align: center;
    padding: 45px 20px;
}

.footer-logo {
    font-family: "Cormorant Garamond", serif;
    font-size: 35px;
    letter-spacing: 5px;
    color: #c8a875;
    margin-bottom: 10px;
}

footer p {
    font-size: 12px;
    letter-spacing: 1px;
}

/* MOBILE */
@media (max-width: 900px) {
    .header-inner {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .nav-link,
    .cart-nav {
        font-size: 17px;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .product-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .logo {
        font-size: 32px;
    }

    nav {
        gap: 6px;
    }

    .category-grid,
    .product-grid {
        grid-template-columns: 1fr;
    }

    .category-card {
        height: 280px;
    }

    .hero {
        min-height: 450px;
    }

    .hero h1 {
        font-size: 55px;
        letter-spacing: 6px;
    }

    .hero p {
        font-size: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">VELORA</div>

        <nav>

            <!-- YÜZÜK -->
            <div class="nav-item">
                <button class="nav-link">Yüzük</button>

                <div class="dropdown">
                    <button onclick="filterCategory('Yüzük', 'Günlük')">Günlük Yüzükler</button>
                    <button onclick="filterCategory('Yüzük', 'Taşlı')">Taşlı Yüzükler</button>
                    <button onclick="filterCategory('Yüzük', 'Kalpli')">Kalpli Yüzükler</button>
                    <button onclick="filterCategory('Yüzük', 'Minimal')">Minimal Yüzükler</button>
                </div>
            </div>

            <!-- BİLEKLİK -->
            <div class="nav-item">
                <button class="nav-link">Bileklik</button>

                <div class="dropdown">
                    <button onclick="filterCategory('Bileklik', 'Minimal')">Minimal Bileklikler</button>
                    <button onclick="filterCategory('Bileklik', 'Taşlı')">Taşlı Bileklikler</button>
                    <button onclick="filterCategory('Bileklik', 'Su Yolu')">Su Yolu Bileklikler</button>
                    <button onclick="filterCategory('Bileklik', 'Zincir')">Zincir Bileklikler</button>
                </div>
            </div>

            <!-- KÜPE -->
            <div class="nav-item">
                <button class="nav-link">Küpe</button>

                <div class="dropdown">
                    <button onclick="filterCategory('Küpe', 'İnci')">İnci Küpeler</button>
                    <button onclick="filterCategory('Küpe', 'Halka')">Halka Küpeler</button>
                    <button onclick="filterCategory('Küpe', 'Taşlı')">Taşlı Küpeler</button>
                    <button onclick="filterCategory('Küpe', 'Minimal')">Minimal Küpeler</button>
                </div>
            </div>

            <!-- KOLYE -->
            <div class="nav-item">
                <button class="nav-link">Kolye</button>

                <div class="dropdown">
                    <button onclick="filterCategory('Kolye', 'İnci')">İnci Kolyeler</button>
                    <button onclick="filterCategory('Kolye', 'Zincir')">Zincir Kolyeler</button>
                    <button onclick="filterCategory('Kolye', 'Minimal')">Minimal Kolyeler</button>
                    <button onclick="filterCategory('Kolye', 'Taşlı')">Taşlı Kolyeler</button>
                </div>
            </div>

            <a href="#urunler" class="cart-nav">Koleksiyon</a>
            <a href="#iletisim" class="cart-nav">İletişim</a>

        </nav>
    </div>
</header>

<!-- HERO -->
<section class="hero">
    <div class="hero-content">
        <h1>VELORA</h1>
        <p>Zarafetin modern hali.</p>
    </div>
</section>

<!-- KATEGORİLER -->
<section class="categories">

    <h2 class="section-title">Koleksiyon</h2>

    <div class="category-grid">

        <div class="category-card" onclick="filterCategory('Yüzük')">
            <img src="resimler/yuzuk.jpg" alt="Yüzük">
            <div class="category-overlay">
                <h3>Yüzük</h3>
            </div>
        </div>

        <div class="category-card" onclick="filterCategory('Bileklik')">
            <img src="resimler/bileklik.jpg" alt="Bileklik">
            <div class="category-overlay">
                <h3>Bileklik</h3>
            </div>
        </div>

        <div class="category-card" onclick="filterCategory('Küpe')">
            <img src="resimler/incikupe.jpg" alt="Küpe">
            <div class="category-overlay">
                <h3>Küpe</h3>
            </div>
        </div>

        <div class="category-card" onclick="filterCategory('Kolye')">
            <img src="resimler/kolye.jpg" alt="Kolye">
            <div class="category-overlay">
                <h3>Kolye</h3>
            </div>
        </div>

    </div>
</section>

<!-- ÜRÜNLER -->
<section class="products-section" id="urunler">

    <h2 class="section-title">Ürünlerimiz</h2>

    <div id="productContainer"></div>

</section>

<footer id="iletisim">
    <div class="footer-logo">VELORA</div>
    <p>Zarafetin modern hali.</p>
    <p style="margin-top:10px;">© 2026 VELORA</p>
</footer>

<script>

/* =========================================
   ÜRÜNLER
========================================= */

const products = [

    {
        id: 0,
        name: "Zarif Yüzük",
        category: "Yüzük",
        subcategory: "Günlük",
        image: "resimler/yuzuk.jpg"
    },

    {
        id: 1,
        name: "Kalp Detaylı Yüzük",
        category: "Yüzük",
        subcategory: "Kalpli",
        image: "resimler/kalp-yuzuk.jpg"
    },

    {
        id: 2,
        name: "Minimal Bileklik",
        category: "Bileklik",
        subcategory: "Minimal",
        image: "resimler/bileklik.jpg"
    },

    {
        id: 3,
        name: "Taşlı Bileklik",
        category: "Bileklik",
        subcategory: "Taşlı",
        image: "resimler/tasli-bileklik.jpg"
    },

    {
        id: 4,
        name: "Su Yolu Bileklik",
        category: "Bileklik",
        subcategory: "Su Yolu",
        image: "resimler/su-yolu-bileklik.jpg"
    },

    {
        id: 5,
        name: "İnci Küpe",
        category: "Küpe",
        subcategory: "İnci",
        image: "resimler/incikupe.jpg"
    },

    {
        id: 6,
        name: "Halka Küpe",
        category: "Küpe",
        subcategory: "Halka",
        image: "resimler/halka-kupe.jpg"
    },

    {
        id: 7,
        name: "İnci Kolye",
        category: "Kolye",
        subcategory: "İnci",
        image: "resimler/kolye.jpg"
    },

    {
        id: 8,
        name: "İnce Zincir Kolye",
        category: "Kolye",
        subcategory: "Zincir",
        image: "resimler/zincir-kolye.jpg"
    },

    {
        id: 9,
        name: "Minimal Kolye",
        category: "Kolye",
        subcategory: "Minimal",
        image: "resimler/minimal-kolye.jpg"
    }

];


/* =========================================
   YILDIZLAR
========================================= */

const selectedStars = Array(products.length).fill(0);


/* =========================================
   ÜRÜNLERİ GÖSTER
========================================= */

function renderProducts(list = products) {

    const container = document.getElementById("productContainer");

    container.innerHTML = "";

    const categories = ["Yüzük", "Bileklik", "Küpe", "Kolye"];

    categories.forEach(category => {

        const categoryProducts = list.filter(
            product => product.category === category
        );

        if (categoryProducts.length === 0) return;

        const heading = document.createElement("h2");

        heading.className = "category-heading";

        heading.textContent = category;

        container.appendChild(heading);


        const grid = document.createElement("div");

        grid.className = "product-grid";


        categoryProducts.forEach(product => {

            const card = document.createElement("div");

            card.className = "product-card";

            card.innerHTML = `

                <img
                    class="product-image"
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.src='resimler/urun1.jpg'"
                >

                <div class="product-info">

                    <h3 class="product-name">
                        ${product.name}
                    </h3>

                    <div class="product-category">
                        ${product.subcategory}
                    </div>

                    <div class="stock-status">
                        Çok Yakında Stoklarda
                    </div>

                    <button class="stock-button" disabled>
                        Yakında Stoklarda
                    </button>

                    <div class="review-box">

                        <div class="stars" id="stars-${product.id}">
                            ${createStars(product.id)}
                        </div>

                        <textarea
                            id="review-${product.id}"
                            class="review-input"
                            placeholder="Ürün hakkındaki düşüncenizi yazın..."
                        ></textarea>

                        <button
                            class="review-button"
                            onclick="addReview(${product.id})"
                        >
                            Yorumu Gönder
                        </button>

                        <div
                            class="reviews"
                            id="reviews-${product.id}"
                        ></div>

                    </div>

                </div>
            `;

            grid.appendChild(card);

            loadReviews(product.id);

        });

        container.appendChild(grid);

    });

}


/* =========================================
   YILDIZ OLUŞTUR
========================================= */

function createStars(productId) {

    let html = "";

    for (let i = 1; i <= 5; i++) {

        html += `
            <span
                class="star"
                onclick="selectStar(${productId}, ${i})"
            >
                ★
            </span>
        `;

    }

    return html;
}


/* =========================================
   YILDIZ SEÇ
========================================= */

function selectStar(productId, starNumber) {

    selectedStars[productId] = starNumber;

    const stars = document.querySelectorAll(
        `#stars-${productId} .star`
    );

    stars.forEach((star, index) => {

        if (index < starNumber) {
            star.classList.add("active");
        } else {
            star.classList.remove("active");
        }

    });

}


/* =========================================
   YORUM EKLE
========================================= */

function addReview(productId) {

    const textArea = document.getElementById(
        `review-${productId}`
    );

    const text = textArea.value.trim();

    const stars = selectedStars[productId];

    if (!stars) {
        alert("Lütfen yıldız puanı seçin.");
        return;
    }

    if (!text) {
        alert("Lütfen yorumunuzu yazın.");
        return;
    }

    const reviews = JSON.parse(
        localStorage.getItem(
            `velora-reviews-${productId}`
        )
    ) || [];

    reviews.push({
        stars: stars,
        text: text
    });

    localStorage.setItem(
        `velora-reviews-${productId}`,
        JSON.stringify(reviews)
    );

    textArea.value = "";

    selectedStars[productId] = 0;

    loadReviews(productId);

    const starsElements = document.querySelectorAll(
        `#stars-${productId} .star`
    );

    starsElements.forEach(star => {
        star.classList.remove("active");
    });

}


/* =========================================
   YORUMLARI YÜKLE
========================================= */

function loadReviews(productId) {

    const reviewsContainer = document.getElementById(
        `reviews-${productId}`
    );

    if (!reviewsContainer) return;

    const reviews = JSON.parse(
        localStorage.getItem(
            `velora-reviews-${productId}`
        )
    ) || [];

    reviewsContainer.innerHTML = "";

    reviews.forEach(review => {

        const reviewElement = document.createElement("div");

        reviewElement.className = "review";

        reviewElement.innerHTML = `
            <div class="review-stars">
                ${"★".repeat(review.stars)}
                ${"☆".repeat(5 - review.stars)}
            </div>

            <div>
                ${escapeHtml(review.text)}
            </div>
        `;

        reviewsContainer.appendChild(reviewElement);

    });

}


/* =========================================
   GÜVENLİ METİN
========================================= */

function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* =========================================
   KATEGORİ FİLTRELEME
========================================= */

function filterCategory(category, subcategory = null) {

    let filtered;

    if (subcategory) {

        filtered = products.filter(product =>
            product.category === category &&
            product.subcategory === subcategory
        );

    } else {

        filtered = products.filter(product =>
            product.category === category
        );

    }

    renderProducts(filtered);

    document
        .getElementById("urunler")
        .scrollIntoView({
            behavior: "smooth"
        });
}


/* =========================================
   BAŞLANGIÇ
========================================= */

renderProducts();

</script>

</body>
</html>
