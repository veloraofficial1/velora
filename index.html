<script>
/* =========================================
   VELORA BACKEND
========================================= */

const API_URL = "https://velora-backend-1-aft5.onrender.com";


/* =========================================
   ÜRÜNLER
========================================= */

const products = [
    { id: 1, name: "Zarif Yüzük", category: "Yüzük", subcategory: "Günlük", image: "resimler/yuzuk.jpg" },
    { id: 2, name: "Taşlı Yüzük", category: "Yüzük", subcategory: "Taşlı", image: "resimler/tasli-yuzuk.jpg" },
    { id: 3, name: "Kalp Detaylı Yüzük", category: "Yüzük", subcategory: "Kalpli", image: "resimler/kalp-yuzuk.jpg" },
    { id: 4, name: "Minimal Yüzük", category: "Yüzük", subcategory: "Minimal", image: "resimler/minimal-yuzuk.jpg" },

    { id: 5, name: "Minimal Bileklik", category: "Bileklik", subcategory: "Minimal", image: "resimler/bileklik.jpg" },
    { id: 6, name: "Taşlı Bileklik", category: "Bileklik", subcategory: "Taşlı", image: "resimler/tasli-bileklik.jpg" },
    { id: 7, name: "Su Yolu Bileklik", category: "Bileklik", subcategory: "Su Yolu", image: "resimler/su-yolu-bileklik.jpg" },
    { id: 8, name: "Zincir Bileklik", category: "Bileklik", subcategory: "Zincir", image: "resimler/zincir-bileklik.jpg" },

    { id: 9, name: "İnci Küpe", category: "Küpe", subcategory: "İnci", image: "resimler/incikupe.jpg" },
    { id: 10, name: "Halka Küpe", category: "Küpe", subcategory: "Halka", image: "resimler/halka-kupe.jpg" },
    { id: 11, name: "Taşlı Küpe", category: "Küpe", subcategory: "Taşlı", image: "resimler/tasli-kupe.jpg" },
    { id: 12, name: "Minimal Küpe", category: "Küpe", subcategory: "Minimal", image: "resimler/minimal-kupe.jpg" },

    { id: 13, name: "İnci Kolye", category: "Kolye", subcategory: "İnci", image: "resimler/kolye.jpg" },
    { id: 14, name: "İnce Zincir Kolye", category: "Kolye", subcategory: "Zincir", image: "resimler/zincir-kolye.jpg" },
    { id: 15, name: "Minimal Kolye", category: "Kolye", subcategory: "Minimal", image: "resimler/minimal-kolye.jpg" },
    { id: 16, name: "Taşlı Kolye", category: "Kolye", subcategory: "Taşlı", image: "resimler/tasli-kolye.jpg" }
];

let selectedStars = Array(products.length + 1).fill(0);


/* =========================================
   HTML GÜVENLİĞİ
========================================= */

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    const div = document.createElement("div");
    div.textContent = String(value);
    return div.innerHTML;
}


/* =========================================
   ÜRÜNLERİ GÖSTER
========================================= */

function renderProducts(list = products) {

    const container = document.getElementById("productContainer");

    if (!container) {
        console.warn("productContainer bulunamadı.");
        return;
    }

    container.innerHTML = "";

    const categories = ["Yüzük", "Bileklik", "Küpe", "Kolye"];

    categories.forEach(category => {

        const categoryProducts = list.filter(
            product => product.category === category
        );

        if (!categoryProducts.length) return;

        const heading = document.createElement("h2");
        heading.className = "category-heading";
        heading.textContent = category;

        container.appendChild(heading);

        const grid = document.createElement("div");
        grid.className = "product-grid";

        categoryProducts.forEach(product => {

            const card = document.createElement("div");
            card.className = "product-card";

            card.innerHTML = `
                <img
                    class="product-image"
                    src="${escapeHtml(product.image)}"
                    alt="${escapeHtml(product.name)}"
                    onerror="this.src='resimler/urun1.jpg'"
                >

                <div class="product-info">

                    <h3 class="product-name">
                        ${escapeHtml(product.name)}
                    </h3>

                    <div class="product-category">
                        ${escapeHtml(product.subcategory)}
                    </div>

                    <div class="stock-status">
                        Çok Yakında Stoklarda
                    </div>

                    <button
                        class="stock-button"
                        disabled>
                        Yakında Stoklarda
                    </button>

                    <div class="review-box">

                        <div
                            class="stars"
                            id="stars-${product.id}">
                            ${createStars(product.id)}
                        </div>

                        <textarea
                            id="review-${product.id}"
                            class="review-input"
                            placeholder="Ürün hakkındaki düşüncenizi yazın..."
                        ></textarea>

                        <button
                            class="review-button"
                            onclick="addReview(${product.id})">
                            Yorumu Gönder
                        </button>

                        <div
                            class="reviews"
                            id="reviews-${product.id}">
                        </div>

                    </div>
                </div>
            `;

            grid.appendChild(card);
        });

        container.appendChild(grid);

        categoryProducts.forEach(product => {
            loadReviews(product.id);
        });
    });
}


/* =========================================
   YILDIZLAR
========================================= */

function createStars(productId) {

    let html = "";

    for (let i = 1; i <= 5; i++) {

        html += `
            <span
                class="star ${selectedStars[productId] >= i ? "active" : ""}"
                onclick="selectStar(${productId}, ${i})">
                ★
            </span>
        `;
    }

    return html;
}


function selectStar(productId, rating) {

    selectedStars[productId] = rating;

    const stars =
        document.getElementById(`stars-${productId}`);

    if (stars) {
        stars.innerHTML = createStars(productId);
    }
}


/* =========================================
   YORUM EKLE
========================================= */

function addReview(productId) {

    const input =
        document.getElementById(`review-${productId}`);

    if (!input) return;

    const text = input.value.trim();
    const rating = selectedStars[productId];

    if (!rating) {
        alert("Lütfen yıldız puanı seçin.");
        return;
    }

    if (!text) {
        alert("Lütfen yorumunuzu yazın.");
        return;
    }

    const storageKey =
        `velora-reviews-${productId}`;

    let reviews = [];

    try {
        reviews =
            JSON.parse(
                localStorage.getItem(storageKey) || "[]"
            );
    } catch {
        reviews = [];
    }

    reviews.push({
        rating: rating,
        text: text,
        date: new Date().toLocaleDateString("tr-TR")
    });

    localStorage.setItem(
        storageKey,
        JSON.stringify(reviews)
    );

    input.value = "";
    selectedStars[productId] = 0;

    const stars =
        document.getElementById(`stars-${productId}`);

    if (stars) {
        stars.innerHTML = createStars(productId);
    }

    loadReviews(productId);
}


/* =========================================
   YORUMLARI YÜKLE
========================================= */

function loadReviews(productId) {

    const container =
        document.getElementById(`reviews-${productId}`);

    if (!container) return;

    const storageKey =
        `velora-reviews-${productId}`;

    let reviews = [];

    try {
        reviews =
            JSON.parse(
                localStorage.getItem(storageKey) || "[]"
            );
    } catch {
        reviews = [];
    }

    container.innerHTML = "";

    reviews.forEach(review => {

        let stars = "";

        for (let i = 1; i <= 5; i++) {
            stars += i <= review.rating ? "★" : "☆";
        }

        const item =
            document.createElement("div");

        item.className = "review-item";

        item.innerHTML = `
            <div class="review-stars">
                ${stars}
            </div>

            <div>
                ${escapeHtml(review.text)}
            </div>

            <small>
                ${escapeHtml(review.date)}
            </small>
        `;

        container.appendChild(item);
    });
}


/* =========================================
   KATEGORİ
========================================= */

function filterCategory(category, subcategory = null) {

    let filtered;

    if (subcategory) {

        filtered =
            products.filter(product =>
                product.category === category &&
                product.subcategory === subcategory
            );

    } else {

        filtered =
            products.filter(product =>
                product.category === category
            );
    }

    renderProducts(filtered);

    setTimeout(() => {

        const section =
            document.getElementById("urunler");

        if (section) {
            section.scrollIntoView({
                behavior: "smooth"
            });
        }

    }, 50);
}


/* =========================================
   AUTH FORM SAKLAMA
========================================= */

function hideAllAuthForms() {

    const forms = [
        "loginForm",
        "registerForm",
        "verifyEmailForm",
        "forgotPasswordForm",
        "resetPasswordForm",
        "changePasswordForm"
    ];

    forms.forEach(id => {

        const element =
            document.getElementById(id);

        if (element) {
            element.style.display = "none";
        }
    });
}


function clearAuthMessages() {

    const ids = [
        "loginMessage",
        "registerMessage",
        "verifyMessage",
        "forgotMessage",
        "resetMessage",
        "changePasswordMessage"
    ];

    ids.forEach(id => {

        const element =
            document.getElementById(id);

        if (element) {
            element.textContent = "";
            element.className = "auth-message";
        }
    });
}


/* =========================================
   AUTH MODAL
========================================= */

function openAuth() {

    const token =
        localStorage.getItem("veloraToken");

    if (token) {
        toggleAccountMenu();
        return;
    }

    const modal =
        document.getElementById("authModal");

    if (modal) {
        modal.classList.add("active");
    }

    showLogin();
}


function closeAuth() {

    const modal =
        document.getElementById("authModal");

    if (modal) {
        modal.classList.remove("active");
    }
}


function showLogin() {

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("loginForm");

    if (form) {
        form.style.display = "block";
    }
}


function showRegister() {

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("registerForm");

    if (form) {
        form.style.display = "block";
    }
}


function showVerifyEmail(email = "") {

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("verifyEmailForm");

    if (form) {
        form.style.display = "block";
    }

    const emailInput =
        document.getElementById("verificationEmail");

    const codeInput =
        document.getElementById("verificationCode");

    if (emailInput && email) {
        emailInput.value = email;
    }

    if (codeInput) {
        codeInput.value = "";
    }
}


function showForgotPassword() {

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("forgotPasswordForm");

    if (form) {
        form.style.display = "block";
    }
}


function showResetPassword(email = "") {

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("resetPasswordForm");

    if (form) {
        form.style.display = "block";
    }

    const emailInput =
        document.getElementById("resetEmail");

    if (emailInput && email) {
        emailInput.value = email;
    }
}


function showChangePassword() {

    const token =
        localStorage.getItem("veloraToken");

    if (!token) {
        openAuth();
        return;
    }

    const modal =
        document.getElementById("authModal");

    if (modal) {
        modal.classList.add("active");
    }

    hideAllAuthForms();
    clearAuthMessages();

    const form =
        document.getElementById("changePasswordForm");

    if (form) {
        form.style.display = "block";
    }
}


/* =========================================
   API
========================================= */

async function apiRequest(endpoint, options = {}) {

    try {

        const response =
            await fetch(
                API_URL + endpoint,
                {
                    ...options,
                    headers: {
                        "Content-Type": "application/json",
                        ...(options.headers || {})
                    }
                }
            );

        let data = {};

        const text =
            await response.text();

        if (text) {

            try {
                data = JSON.parse(text);
            } catch {
                data = {
                    message: text
                };
            }
        }

        return {
            response,
            data
        };

    } catch (error) {

        console.error(
            "API bağlantı hatası:",
            error
        );

        throw new Error(
            "Sunucuya bağlanılamadı. İnternet bağlantısını ve backend adresini kontrol et."
        );
    }
}


/* =========================================
   KAYIT
========================================= */

async function register(event) {

    event.preventDefault();

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const passwordConfirm =
        document
            .getElementById("registerPasswordConfirm")
            .value;

    const message =
        document.getElementById("registerMessage");

    if (password !== passwordConfirm) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Şifreler aynı değil.";

        return;
    }

    if (password.length < 6) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Şifre en az 6 karakter olmalıdır.";

        return;
    }

    message.className = "auth-message";
    message.textContent = "Hesap oluşturuluyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/register",
                {
                    method: "POST",

                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        passwordConfirm
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Hesap oluşturulamadı."
            );
        }

        if (data.verificationRequired) {

            message.className =
                "auth-message success-message";

            message.textContent =
                "6 haneli doğrulama kodu e-posta adresine gönderildi.";

            setTimeout(() => {
                showVerifyEmail(
                    data.email || email
                );
            }, 700);

            return;
        }

        message.className =
            "auth-message success-message";

        message.textContent =
            "Hesabınız oluşturuldu.";

        setTimeout(showLogin, 1000);

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Bir hata oluştu.";
    }
}


/* =========================================
   E-POSTA DOĞRULAMA
========================================= */

async function verifyEmail(event) {

    event.preventDefault();

    const email =
        document
            .getElementById("verificationEmail")
            .value
            .trim();

    const code =
        document
            .getElementById("verificationCode")
            .value
            .trim();

    const message =
        document.getElementById("verifyMessage");

    if (!/^\d{6}$/.test(code)) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Lütfen 6 haneli doğrulama kodunu gir.";

        return;
    }

    message.className = "auth-message";
    message.textContent = "E-posta doğrulanıyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/verify-email",
                {
                    method: "POST",

                    body: JSON.stringify({
                        email,
                        code
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Doğrulama başarısız."
            );
        }

        message.className =
            "auth-message success-message";

        message.textContent =
            "E-posta adresin doğrulandı. Giriş yapabilirsin.";

        setTimeout(showLogin, 1200);

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Doğrulama sırasında hata oluştu.";
    }
}


/* =========================================
   TEKRAR DOĞRULAMA KODU
========================================= */

async function resendVerificationCode() {

    const emailInput =
        document.getElementById("verificationEmail");

    const message =

    if (!emailInput || !message) return;

    const email =
        emailInput.value.trim();

    message.className = "auth-message";

        "Yeni kod gönderiliyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/resend-verification",
                {
                    method: "POST",

                    body: JSON.stringify({
                        email
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Kod gönderilemedi."
            );
        }

        message.className =
            "auth-message success-message";

        message.textContent =
            "Yeni doğrulama kodu gönderildi.";

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Kod gönderilemedi.";
    }
}


/* =========================================
   GİRİŞ
========================================= */

async function login(event) {

    event.preventDefault();

    const username =
        document
            .getElementById("loginUsername")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;

    const message =
        document.getElementById("loginMessage");

    message.className = "auth-message";
    message.textContent = "Giriş yapılıyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/login",
                {
                    method: "POST",

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (
            !response.ok &&
            data.verificationRequired
        ) {

            message.className =
                "auth-message error-message";

            message.textContent =
                "Önce e-posta adresini doğrulamalısın.";

            setTimeout(() => {
                showVerifyEmail(
                    data.email || ""
                );
            }, 700);

            return;
        }

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Giriş yapılamadı."
            );
        }

        if (!data.token) {
            throw new Error(
                "Sunucudan giriş anahtarı alınamadı."
            );
        }

        localStorage.setItem(
            "veloraToken",
            data.token
        );

        if (data.user) {

            localStorage.setItem(
                "veloraUser",
                JSON.stringify(data.user)
            );
        }

        updateAccountUI();

        message.className =
            "auth-message success-message";

        message.textContent =
            "Giriş başarılı!";

        setTimeout(closeAuth, 700);

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Kullanıcı adı veya şifre hatalı.";
    }
}

/* =========================================
   ŞİFRE SIFIRLA
========================================= */

async function resetPassword(event) {

    event.preventDefault();

    const email =
        document.getElementById("resetEmail").value.trim();

    const code =
        document.getElementById("resetCode").value.trim();

    const password =
        document.getElementById("resetPassword").value;

    const passwordConfirm =
        document
            .getElementById("resetPasswordConfirm")
            .value;

    const message =
        document.getElementById("resetMessage");

    if (password !== passwordConfirm) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Yeni şifreler aynı değil.";

        return;
    }

    if (password.length < 6) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Şifre en az 6 karakter olmalıdır.";

        return;
    }

    if (!/^\d{6}$/.test(code)) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "6 haneli kodu doğru gir.";

        return;
    }

    message.className = "auth-message";
    message.textContent =
        "Şifre yenileniyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/reset-password",
                {
                    method: "POST",

                    body: JSON.stringify({
                        email,
                        code,
                        password,
                        passwordConfirm
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Şifre yenilenemedi."
            );
        }

        message.className =
            "auth-message success-message";

        message.textContent =
            "Şifren başarıyla yenilendi.";

        setTimeout(showLogin, 1200);

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Şifre yenilenemedi.";
    }
}


/* =========================================
   ŞİFRE DEĞİŞTİR
========================================= */

async function changePassword(event) {

    event.preventDefault();

    const token =
        localStorage.getItem("veloraToken");

    if (!token) {
        openAuth();
        return;
    }

    const currentPassword =
        document
            .getElementById("currentPassword")
            .value;

    const newPassword =
        document
            .getElementById("newPassword")
            .value;

    const newPasswordConfirm =
        document
            .getElementById("newPasswordConfirm")
            .value;

    const message =
        document.getElementById(
            "changePasswordMessage"
        );

    if (newPassword !== newPasswordConfirm) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Yeni şifreler aynı değil.";

        return;
    }

    if (newPassword.length < 6) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Yeni şifre en az 6 karakter olmalıdır.";

        return;
    }

    message.className = "auth-message";
    message.textContent =
        "Şifre değiştiriliyor...";

    try {

        const result =
            await apiRequest(
                "/api/auth/change-password",
                {
                    method: "POST",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        currentPassword,
                        newPassword,
                        newPasswordConfirm
                    })
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Şifre değiştirilemedi."
            );
        }

        message.className =
            "auth-message success-message";

        message.textContent =
            "Şifren başarıyla değiştirildi.";

        document.getElementById(
            "currentPassword"
        ).value = "";

        document.getElementById(
            "newPassword"
        ).value = "";

        document.getElementById(
            "newPasswordConfirm"
        ).value = "";

        setTimeout(closeAuth, 1200);

    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Şifre değiştirilemedi.";
    }
}


/* =========================================
   KULLANICI BİLGİSİ
========================================= */

async function loadCurrentUser() {

    const token =
        localStorage.getItem("veloraToken");

    if (!token) {
        updateAccountUI();
        return;
    }

    try {

        const result =
            await apiRequest(
                "/api/auth/me",
                {
                    method: "GET",

                    headers: {
                        Authorization:
                            `Bearer ${token}`
                    }
                }
            );

        const response = result.response;
        const data = result.data;

        if (!response.ok) {
            throw new Error(
                data.message ||
                "Oturum geçersiz."
            );
        }

        if (data.user) {

            localStorage.setItem(
                "veloraUser",
                JSON.stringify(data.user)
            );
        }

        updateAccountUI();

    } catch (error) {

        console.log(
            "Oturum kontrolü:",
            error.message
        );

        localStorage.removeItem(
            "veloraToken"
        );

        localStorage.removeItem(
            "veloraUser"
        );

        updateAccountUI();
    }
}


/* =========================================
   ŞİFRE DEĞİŞTİR BUTONU
========================================= */

function ensureChangePasswordButton() {

    const menu =
        document.getElementById("accountMenu");

    if (!menu) return;

    if (
        document.getElementById(
            "changePasswordMenuButton"
        )
    ) {
        return;
    }

    const button =
        document.createElement("button");

    button.id =
        "changePasswordMenuButton";

    button.type = "button";

    button.textContent =
        "🔑 Şifre Değiştir";

    button.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            menu.classList.remove("active");

            showChangePassword();
        }
    );

    const logoutButton =
        Array.from(
            menu.querySelectorAll("button")
        ).find(button =>
            button.textContent
                .toLowerCase()
                .includes("çıkış")
        );

    if (logoutButton) {

        menu.insertBefore(
            button,
            logoutButton
        );

    } else {

        menu.appendChild(button);
    }
}


/* =========================================
   HESAP MENÜSÜ
========================================= */

function toggleAccountMenu() {

    const menu =
        document.getElementById("accountMenu");

    if (!menu) return;

    ensureChangePasswordButton();

    menu.classList.toggle("active");
}


/* =========================================
   HESAP ARAYÜZÜ
========================================= */

function updateAccountUI() {

    const token =
        localStorage.getItem("veloraToken");

    const userText =
        localStorage.getItem("veloraUser");

    const button =
        document.getElementById("accountButton");

    const username =
        document.getElementById("accountUsername");

    const email =
        document.getElementById("accountEmail");

    if (!button) return;

    if (token && userText) {

        let user = null;

        try {
            user = JSON.parse(userText);
        } catch {
            user = null;
        }

        if (user) {

            const displayName =
                user.username ||
                user.email ||
                "Hesabım";

            button.textContent =
                `👤 ${displayName}`;

            if (username) {
                username.textContent =
                    displayName;
            }

            if (email) {
                email.textContent =
                    user.email || "";
            }

            ensureChangePasswordButton();

            return;
        }
    }

    button.textContent =
        "👤 Hesap";

    if (username) {
        username.textContent =
            "Hesabım";
    }

    if (email) {
        email.textContent = "";
    }
}


/* =========================================
   ÇIKIŞ
========================================= */

function logout() {

    localStorage.removeItem(
        "veloraToken"
    );

    localStorage.removeItem(
        "veloraUser"
    );

    const menu =
        document.getElementById("accountMenu");

    if (menu) {
        menu.classList.remove("active");
    }

    updateAccountUI();

    alert(
        "Hesabınızdan çıkış yapıldı."
    );
}


/* =========================================
   SAYFA HAZIR
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        try {

            const accountButton =
                document.getElementById(
                    "accountButton"
                );

            if (accountButton) {

                accountButton.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        const token =
                            localStorage.getItem(
                                "veloraToken"
                            );

                        if (token) {
                            toggleAccountMenu();
                        } else {
                            openAuth();
                        }
                    }
                );
            }


            document.addEventListener(
                "click",
                function(event) {

                    const accountArea =
                        document.querySelector(
                            ".account-area"
                        );

                    const menu =
                        document.getElementById(
                            "accountMenu"
                        );

                    if (
                        accountArea &&
                        menu &&
                        !accountArea.contains(
                            event.target
                        )
                    ) {

                        menu.classList.remove(
                            "active"
                        );
                    }
                }
            );


            const authModal =
                document.getElementById(
                    "authModal"
                );

            if (authModal) {

                authModal.addEventListener(
                    "click",
                    function(event) {

                        if (
                            event.target === authModal
                        ) {
                            closeAuth();
                        }
                    }
                );
            }


            renderProducts();

            loadCurrentUser();

        } catch (error) {

            console.error(
                "VELORA başlatma hatası:",
                error
            );

        }

    }
);

</script>
