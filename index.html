/* =========================================

function renderProducts(list = products) {

    const container =
        document.getElementById("productContainer");

    if (!container) return;

    container.innerHTML = "";

    const categories = [
        "Yüzük",
        "Bileklik",
        "Küpe",
        "Kolye"
    ];

    categories.forEach(category => {

        const categoryProducts =
            list.filter(
                product =>
                    product.category === category
            );

        if (categoryProducts.length === 0) {
            return;
        }

        const heading =
            document.createElement("h2");

        heading.className =
            "category-heading";

        heading.textContent =
            category;

        container.appendChild(heading);

        const grid =
            document.createElement("div");

        grid.className =
            "product-grid";

        categoryProducts.forEach(product => {

            const card =
                document.createElement("div");

            card.className =
                "product-card";

            card.innerHTML = `

                <img
                    class="product-image"
                    src="${product.image}"
                    alt="${product.name}"
                    onerror="this.src='resimler/urun1.jpg'"
                >

                <div class="product-info">

                    <h3 class="product-name">
                        ${product.name}
                    </h3>

                    <div class="product-category">
                        ${product.subcategory}
                    </div>

                    <div class="stock-status">
                        Çok Yakında Stoklarda
                    </div>

                    <button
                        class="stock-button"
                        disabled>
                        Yakında Stoklarda
                    </button>

                    <div class="review-box">

                        <div
                            class="stars"
                            id="stars-${product.id}">
                            ${createStars(product.id)}
                        </div>

                        <textarea
                            id="review-${product.id}"
                            class="review-input"
                            placeholder="Ürün hakkındaki düşüncenizi yazın..."
                        ></textarea>

                        <button
                            class="review-button"
                            onclick="addReview(${product.id})">
                            Yorumu Gönder
                        </button>

                        <div
                            class="reviews"
                            id="reviews-${product.id}">
                        </div>

                    </div>

                </div>
            `;

            grid.appendChild(card);

        });

        container.appendChild(grid);

        categoryProducts.forEach(product => {

            loadReviews(product.id);

        });

    });

}


/* =========================================
   YILDIZLAR
========================================= */

function createStars(productId) {

    let html = "";

    for (let i = 1; i <= 5; i++) {

        html += `
            <span
                class="star ${selectedStars[productId] >= i ? "active" : ""}"
                onclick="selectStar(${productId}, ${i})">
                ★
            </span>
        `;

    }

    return html;

}


function selectStar(productId, rating) {

    selectedStars[productId] =
        rating;

    const stars =
        document.getElementById(
            `stars-${productId}`
        );

    if (stars) {

        stars.innerHTML =
            createStars(productId);

    }

}


/* =========================================
   YORUM EKLE
========================================= */

function addReview(productId) {

    const input =
        document.getElementById(
            `review-${productId}`
        );

    const text =
        input.value.trim();

    const rating =
        selectedStars[productId];

    if (!rating) {

        alert(
            "Lütfen yıldız puanı seçin."
        );

        return;

    }

    if (!text) {

        alert(
            "Lütfen yorumunuzu yazın."
        );

        return;

    }

    const storageKey =
        `velora-reviews-${productId}`;

    const reviews =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || [];

    reviews.push({

        rating: rating,

        text: text,

        date:
            new Date()
                .toLocaleDateString("tr-TR")

    });

    localStorage.setItem(
        storageKey,
        JSON.stringify(reviews)
    );

    input.value = "";

    selectedStars[productId] = 0;

    const stars =
        document.getElementById(
            `stars-${productId}`
        );

    if (stars) {

        stars.innerHTML =
            createStars(productId);

    }

    loadReviews(productId);

}


/* =========================================
   YORUMLARI YÜKLE
========================================= */

function loadReviews(productId) {

    const container =
        document.getElementById(
            `reviews-${productId}`
        );

    if (!container) {
        return;
    }

    const storageKey =
        `velora-reviews-${productId}`;

    const reviews =
        JSON.parse(
            localStorage.getItem(storageKey)
        ) || [];

    container.innerHTML = "";

    reviews.forEach(review => {

        const item =
            document.createElement("div");

        item.className =
            "review-item";

        let stars = "";

        for (let i = 1; i <= 5; i++) {

            stars +=
                i <= review.rating
                    ? "★"
                    : "☆";

        }

        item.innerHTML = `

            <div class="review-stars">
                ${stars}
            </div>

            <div>
                ${escapeHtml(review.text)}
            </div>

            <small>
                ${review.date}
            </small>

        `;

        container.appendChild(item);

    });

}


/* =========================================
   GÜVENLİ METİN
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   KATEGORİ FİLTRELEME
========================================= */

function filterCategory(
    category,
    subcategory = null
) {

    let filtered;

    if (subcategory) {

        filtered =
            products.filter(
                product =>
                    product.category === category &&
                    product.subcategory === subcategory
            );

    } else {

        filtered =
            products.filter(
                product =>
                    product.category === category
            );

    }

    renderProducts(filtered);

    setTimeout(() => {

        const productsSection =
            document.getElementById("urunler");

        if (productsSection) {

            productsSection.scrollIntoView({
                behavior: "smooth"
            });

        }

    }, 50);

}

    ];

    ids.forEach(id => {

        if (element) {

            element.textContent = "";
            element.className = "auth-message";

        }

    });

}


/* =========================================
   API
========================================= */

async function apiRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            `${API_URL}${endpoint}`,
            {
                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );


    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }


    return {
        response,
        data
    };

}


/* =========================================
   KAYIT
========================================= */

async function register(event) {

    event.preventDefault();

    const username =
        document
            .getElementById("registerUsername")
            .value
            .trim();

    const email =
        document
            .getElementById("registerEmail")
            .value
            .trim();

    const password =
        document
            .getElementById("registerPassword")
            .value;

    const passwordConfirm =
        document
            .getElementById(
                "registerPasswordConfirm"
            )
            .value;

    const message =
        document
            .getElementById(
                "registerMessage"
            );


    if (password !== passwordConfirm) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Şifreler aynı değil.";

        return;

    }


    if (password.length < 6) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Şifre en az 6 karakter olmalıdır.";

        return;

    }


    message.className =
        "auth-message";

    message.textContent =
        "Hesap oluşturuluyor...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/api/auth/register",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            email,
                            password,
                            passwordConfirm
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Hesap oluşturulamadı."
            );

        }


        if (data.verificationRequired) {

            message.className =
                "auth-message success-message";

            message.textContent =
                "Doğrulama kodu e-posta adresine gönderildi.";

            setTimeout(() => {

                showVerifyEmail(
                    data.email || email
                );

            }, 700);

            return;

        }


        message.className =
            "auth-message success-message";

        message.textContent =
            "Hesabınız oluşturuldu.";

        setTimeout(() => {

            showLogin();

        }, 1000);


    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Bir hata oluştu.";

    }

}


/* =========================================
   E-POSTA DOĞRULA
========================================= */

async function verifyEmail(event) {

    event.preventDefault();

    const email =
        document
            .getElementById(
                "verificationEmail"
            )
            .value
            .trim();

    const code =
        document
            .getElementById(
                "verificationCode"
            )
            .value
            .trim();

    const message =
        document
            .getElementById(
                "verifyMessage"
            );


    if (!/^\d{6}$/.test(code)) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Lütfen 6 haneli doğrulama kodunu gir.";

        return;

    }


    message.className =
        "auth-message";

    message.textContent =
        "E-posta doğrulanıyor...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/api/auth/verify-email",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            email,
                            code
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Doğrulama başarısız."
            );

        }


        message.className =
            "auth-message success-message";

        message.textContent =
            "E-posta adresin doğrulandı. Giriş yapabilirsin.";


        setTimeout(() => {

            showLogin();

        }, 1200);


    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Doğrulama sırasında hata oluştu.";

    }

}

/* =========================================
   GİRİŞ
========================================= */

async function login(event) {

    event.preventDefault();

    const username =
        document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const message =
        document
            .getElementById(
                "loginMessage"
            );


    message.className =
        "auth-message";

    message.textContent =
        "Giriş yapılıyor...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/api/auth/login",
                {
                    method: "POST",

                    body:
                        JSON.stringify({
                            username,
                            password
                        })
                }
            );


        if (
            !response.ok &&
            data.verificationRequired
        ) {

            message.className =
                "auth-message error-message";

            message.textContent =
                "Önce e-posta adresini doğrulamalısın.";

            setTimeout(() => {

                showVerifyEmail(
                    data.email || username
                );

            }, 700);

            return;

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Giriş yapılamadı."
            );

        }


        if (!data.token) {

            throw new Error(
                "Sunucudan giriş anahtarı alınamadı."
            );

        }


        localStorage.setItem(
            "veloraToken",
            data.token
        );


        if (data.user) {

            localStorage.setItem(
                "veloraUser",
                JSON.stringify(data.user)
            );

        }


        message.className =
            "auth-message success-message";

        message.textContent =
            "Giriş başarılı!";


        updateAccountUI();


        setTimeout(() => {

            closeAuth();

        }, 700);


    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Kullanıcı adı veya şifre hatalı.";

    }

}

        message.textContent =
            error.message ||
            "Şifre yenilenemedi.";

    }

}


/* =========================================
   ŞİFRE DEĞİŞTİR
========================================= */

async function changePassword(event) {

    event.preventDefault();

    const token =
        localStorage.getItem(
            "veloraToken"
        );


    if (!token) {

        showLogin();

        return;

    }


    const currentPassword =
        document
            .getElementById(
                "currentPassword"
            )
            .value;

    const newPassword =
        document
            .getElementById(
                "newPassword"
            )
            .value;

    const newPasswordConfirm =
        document
            .getElementById(
                "newPasswordConfirm"
            )
            .value;

    const message =
        document
            .getElementById(
                "changePasswordMessage"
            );


    if (newPassword !== newPasswordConfirm) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Yeni şifreler aynı değil.";

        return;

    }


    if (newPassword.length < 6) {

        message.className =
            "auth-message error-message";

        message.textContent =
            "Yeni şifre en az 6 karakter olmalıdır.";

        return;

    }


    message.className =
        "auth-message";

    message.textContent =
        "Şifre değiştiriliyor...";


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/api/auth/change-password",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    },

                    body:
                        JSON.stringify({
                            currentPassword,
                            newPassword,
                            newPasswordConfirm
                        })
                }
            );


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Şifre değiştirilemedi."
            );

        }


        message.className =
            "auth-message success-message";

        message.textContent =
            "Şifren başarıyla değiştirildi.";


        document
            .getElementById(
                "currentPassword"
            )
            .value = "";

        document
            .getElementById(
                "newPassword"
            )
            .value = "";

        document
            .getElementById(
                "newPasswordConfirm"
            )
            .value = "";


        setTimeout(() => {

            closeAuth();

        }, 1200);


    } catch (error) {

        console.error(error);

        message.className =
            "auth-message error-message";

        message.textContent =
            error.message ||
            "Şifre değiştirilemedi.";

    }

}


/* =========================================
   KULLANICI BİLGİSİ
========================================= */

async function loadCurrentUser() {

    const token =
        localStorage.getItem(
            "veloraToken"
        );


    if (!token) {

        updateAccountUI();

        return;

    }


    try {

        const {
            response,
            data
        } =
            await apiRequest(
                "/api/auth/me",
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`
                    }
                }
            );


        if (!response.ok) {

            throw new Error(
                "Oturum geçersiz."
            );

        }


        if (data.user) {

            localStorage.setItem(
                "veloraUser",
                JSON.stringify(data.user)
            );

        }


        updateAccountUI();


    } catch (error) {

        console.log(
            "Oturum kontrolü:",
            error.message
        );


        localStorage.removeItem(
            "veloraToken"
        );

        localStorage.removeItem(
            "veloraUser"
        );


        updateAccountUI();

    }

}


/* =========================================
   ŞİFRE DEĞİŞTİR BUTONU EKLE
========================================= */

function ensureChangePasswordButton() {

    const menu =
        document.getElementById(
            "accountMenu"
        );

    if (!menu) return;


    let button =
        document.getElementById(
            "changePasswordMenuButton"
        );


    if (!button) {

        button =
            document.createElement("button");

        button.id =
            "changePasswordMenuButton";

        button.type =
            "button";

        button.textContent =
            "🔑 Şifre Değiştir";


        button.onclick = function(event) {

            event.stopPropagation();

            menu.classList.remove("active");

            const modal =
                document.getElementById(
                    "authModal"
                );

            if (modal) {

                modal.classList.add("active");

            }

            showChangePassword();

        };


        /*
           Menüdeki çıkış butonundan önce ekle.
           Çıkış butonu bulunamazsa sona ekle.
        */

        const logoutButton =
            Array.from(
                menu.querySelectorAll("button")
            ).find(button =>
                button.textContent
                    .toLowerCase()
                    .includes("çıkış")
            );


        if (logoutButton) {

            menu.insertBefore(
                button,
                logoutButton
            );

        } else {

            menu.appendChild(button);

        }

    }

}


/* =========================================
   HESAP MENÜSÜ
========================================= */

function toggleAccountMenu() {

    const menu =
        document.getElementById(
            "accountMenu"
        );

    if (!menu) return;


    ensureChangePasswordButton();


    menu.classList.toggle("active");

}


/* =========================================
   HESAP ARAYÜZÜ
========================================= */

function updateAccountUI() {

    const token =
        localStorage.getItem(
            "veloraToken"
        );

    const userText =
        localStorage.getItem(
            "veloraUser"
        );


    const button =
        document.getElementById(
            "accountButton"
        );

    const username =
        document.getElementById(
            "accountUsername"
        );

    const email =
        document.getElementById(
            "accountEmail"
        );


    if (!button) return;


    if (token && userText) {

        let user = null;

        try {

            user =
                JSON.parse(userText);

        } catch {

            user = null;

        }


        if (user) {

            const displayName =
                user.username ||
                user.email ||
                "Hesabım";


            button.textContent =
                `👤 ${displayName}`;


            if (username) {

                username.textContent =
                    displayName;

            }


            if (email) {

                email.textContent =
                    user.email ||
                    "";

            }


            ensureChangePasswordButton();

            return;

        }

    }


    button.textContent =
        "👤 Hesap";


    if (username) {

        username.textContent =
            "Hesabım";

    }


    if (email) {

        email.textContent =
            "";

    }

}


/* =========================================
   ÇIKIŞ
========================================= */

function logout() {

    localStorage.removeItem(
        "veloraToken"
    );

    localStorage.removeItem(
        "veloraUser"
    );


    const menu =
        document.getElementById(
            "accountMenu"
        );

    if (menu) {

        menu.classList.remove(
            "active"
        );

    }


    updateAccountUI();


    alert(
        "Hesabınızdan çıkış yapıldı."
    );

}


/* =========================================
   HESAP BUTONU
========================================= */

const accountButton =
    document.getElementById(
        "accountButton"
    );


if (accountButton) {

    accountButton.addEventListener(
        "click",
        function(event) {

            event.stopPropagation();

            const token =
                localStorage.getItem(
                    "veloraToken"
                );


            if (token) {

                toggleAccountMenu();

            } else {

                openAuth();

            }

        }
    );

}


/* =========================================
   HESAP MENÜSÜ DIŞINA TIKLAMA
========================================= */

document.addEventListener(
    "click",
    function(event) {

        const accountArea =
            document.querySelector(
                ".account-area"
            );

        const menu =
            document.getElementById(
                "accountMenu"
            );


        if (
            accountArea &&
            menu &&
            !accountArea.contains(event.target)
        ) {

            menu.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================
   MODAL DIŞINA TIKLAMA
========================================= */

const authModal =
    document.getElementById(
        "authModal"
    );


if (authModal) {

    authModal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeAuth();

            }

        }
    );

}


/* =========================================
   SAYFA AÇILINCA
========================================= */

renderProducts();

loadCurrentUser();

</script>
