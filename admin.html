<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f0e5;
      color: #3f3428;
    }

    .hidden {
      display: none !important;
    }

    header {
      background: #3f3428;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      letter-spacing: 4px;
      font-size: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .gold-btn {
      background: #b89455;
      color: white;
    }

    .gold-btn:hover {
      background: #9f7c43;
    }

    .logout-btn {
      background: white;
      color: #3f3428;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .login-box h2 {
      text-align: center;
      margin-top: 0;
      letter-spacing: 3px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 16px;
      border: 1px solid #d8cbb8;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .error {
      background: #fbe4e4;
      color: #a33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      padding: 30px 20px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .stat span {
      display: block;
      color: #8b7a64;
      margin-bottom: 10px;
    }

    .stat strong {
      font-size: 28px;
    }

    .section {
      background: white;
      padding: 22px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
      overflow-x: auto;
    }

    .section h2 {
      margin-top: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      text-align: left;
      padding: 13px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }

    th {
      background: #f8f3eb;
    }

    .danger {
      background: #b84b4b;
      color: white;
    }

    .danger:hover {
      background: #963939;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .status {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #d8cbb8;
    }

    .message {
      padding: 12px;
      background: #eee6d9;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        padding: 16px;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage" class="login-page">
    <div class="login-box">

      <h2>VELORA</h2>
      <p style="text-align:center;">Admin Paneli</p>

      <div id="loginError" class="error"></div>

      <form id="loginForm">

        <label>Admin Kullanıcı Adı</label>
        <input
          id="adminUsername"
          type="text"
          placeholder="Kullanıcı adı"
          required
        >

        <label>Admin Şifresi</label>
        <input
          id="adminPassword"
          type="password"
          placeholder="Şifre"
          required
        >

        <button
          type="submit"
          class="gold-btn"
          style="width:100%;"
        >
          Giriş Yap
        </button>

      </form>

    </div>
  </div>


  <!-- PANEL -->
  <div id="adminPage" class="hidden">

    <header>
      <h1>VELORA ADMIN</h1>

      <button
        class="logout-btn"
        onclick="logout()"
      >
        Çıkış Yap
      </button>
    </header>


    <main class="container">

      <div class="welcome">
        <h2>Yönetim Paneli</h2>
        <p>VELORA mağazasını buradan yönetebilirsin.</p>
      </div>

      <div id="globalMessage" class="message"></div>


      <!-- ADMİN İŞLEMLERİ -->
      <div class="admin-actions">

        <button
          class="gold-btn"
          onclick="loadAll()"
        >
          Yenile
        </button>

        <button
          class="gold-btn"
          onclick="migrateToSupabase()"
        >
          Supabase'e Taşı
        </button>

      </div>


      <!-- İSTATİSTİKLER -->
      <div class="stats">

        <div class="stat">
          <span>Toplam Kullanıcı</span>
          <strong id="userCount">0</strong>
        </div>

        <div class="stat">
          <span>Toplam Sipariş</span>
          <strong id="orderCount">0</strong>
        </div>

        <div class="stat">
          <span>Yeni Sipariş</span>
          <strong id="newOrderCount">0</strong>
        </div>

        <div class="stat">
          <span>Toplam Tutar</span>
          <strong id="totalAmount">0 TL</strong>
        </div>

      </div>


      <!-- KULLANICILAR -->
      <div class="section">

        <h2>Kullanıcılar</h2>

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Kullanıcı Adı</th>
              <th>E-posta</th>
              <th>Kayıt Tarihi</th>
              <th>İşlem</th>
            </tr>
          </thead>

          <tbody id="usersTable">
          </tbody>

        </table>

      </div>


      <!-- SİPARİŞLER -->
      <div class="section">

        <h2>Siparişler</h2>

        <table>

          <thead>
            <tr>
              <th>ID</th>
              <th>Müşteri</th>
              <th>Telefon</th>
              <th>Adres</th>
              <th>Ürünler</th>
              <th>Tutar</th>
              <th>Durum</th>
              <th>Tarih</th>
              <th>İşlem</th>
            </tr>
          </thead>

          <tbody id="ordersTable">
          </tbody>

        </table>

      </div>

    </main>

  </div>


<script>

  /*
   * VELORA BACKEND
   */
  const API_URL =
    "https://velora-backend-1-aft5.onrender.com";


  /*
   * ELEMENTLER
   */
  const loginPage =
    document.getElementById("loginPage");

  const adminPage =
    document.getElementById("adminPage");

  const loginForm =
    document.getElementById("loginForm");

  const loginError =
    document.getElementById("loginError");


  /*
   * HTML GÜVENLİĞİ
   */
  function escapeHtml(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
   * GENEL MESAJ
   */
  function showMessage(message) {

    const box =
      document.getElementById("globalMessage");

    box.textContent = message;
    box.style.display = "block";

    setTimeout(() => {
      box.style.display = "none";
    }, 4000);
  }


  /*
   * API İSTEĞİ
   */
  async function apiRequest(
    endpoint,
    options = {}
  ) {

    const token =
      localStorage.getItem("veloraAdminToken");

    const headers = {
      "Content-Type": "application/json",
      ...(options.headers || {})
    };

    if (token) {
      headers.Authorization =
        "Bearer " + token;
    }

    const response =
      await fetch(
        API_URL + endpoint,
        {
          ...options,
          headers
        }
      );


    /*
     * Önce response'u text olarak alıyoruz.
     * Böylece HTML gelirse
     * Unexpected token < hatası yerine
     * gerçek cevabı görebileceğiz.
     */
    const text =
      await response.text();


    let data;

    try {

      data =
        text ? JSON.parse(text) : {};

    } catch (error) {

      console.error(
        "Sunucudan JSON yerine gelen cevap:",
        text
      );

      throw new Error(
        "Sunucu JSON yerine HTML/metin döndürdü. API adresini kontrol et."
      );
    }


    if (!response.ok) {

      throw new Error(
        data.message ||
        data.error ||
        "API isteği başarısız."
      );

    }

    return data;
  }


  /*
   * ADMİN GİRİŞ
   */
  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      loginError.style.display = "none";

      const username =
        document
          .getElementById("adminUsername")
          .value
          .trim();

      const password =
        document
          .getElementById("adminPassword")
          .value;


      try {

        const data =
          await apiRequest(
            "/api/admin/login",
            {
              method: "POST",
              body: JSON.stringify({
                username,
                password
              })
            }
          );


        if (!data.token) {
          throw new Error(
            "Sunucu token göndermedi."
          );
        }


        localStorage.setItem(
          "veloraAdminToken",
          data.token
        );


        showAdminPanel();


      } catch (error) {

        console.error(error);

        loginError.textContent =
          error.message;

        loginError.style.display =
          "block";
      }

    }
  );


  /*
   * PANELİ GÖSTER
   */
  function showAdminPanel() {

    loginPage.classList.add("hidden");

    adminPage.classList.remove("hidden");

    loadAll();
  }


  /*
   * ÇIKIŞ
   */
  function logout() {

    localStorage.removeItem(
      "veloraAdminToken"
    );

    adminPage.classList.add("hidden");

    loginPage.classList.remove("hidden");

    loginForm.reset();
  }


  /*
   * TÜM VERİLERİ YÜKLE
   */
  async function loadAll() {

    try {

      await Promise.all([
        loadStats(),
        loadUsers(),
        loadOrders()
      ]);

    } catch (error) {

      console.error(error);

      showMessage(
        error.message
      );

    }

  }


  /*
   * İSTATİSTİKLER
   */
  async function loadStats() {

    const data =
      await apiRequest(
        "/api/admin/stats"
      );


    const stats =
      data.stats || data;


    document.getElementById(
      "userCount"
    ).textContent =
      stats.userCount ??
      stats.users ??
      0;


    document.getElementById(
      "orderCount"
    ).textContent =
      stats.orderCount ??
      stats.orders ??
      0;


    document.getElementById(
      "newOrderCount"
    ).textContent =
      stats.newOrderCount ??
      stats.newOrders ??
      0;


    const total =
      Number(
        stats.totalAmount ??
        stats.total ??
        0
      );


    document.getElementById(
      "totalAmount"
    ).textContent =
      total.toLocaleString(
        "tr-TR"
      ) + " TL";

  }


  /*
   * KULLANICILAR
   */
  async function loadUsers() {

    const data =
      await apiRequest(
        "/api/admin/users"
      );


    const users =
      Array.isArray(data)
        ? data
        : (
            data.users ||
            data.data ||
            []
          );


    const table =
      document.getElementById(
        "usersTable"
      );


    table.innerHTML = "";


    if (users.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="5">
            Henüz kullanıcı yok.
          </td>
        </tr>
      `;

      return;
    }


    users.forEach(
      function(user) {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(user.id)}
          </td>

          <td>
            ${escapeHtml(user.username)}
          </td>

          <td>
            ${escapeHtml(user.email)}
          </td>

          <td>
            ${escapeHtml(
              user.created_at ||
              user.createdAt ||
              ""
            )}
          </td>

          <td>

            <button
              class="danger"
              onclick="deleteUser(${Number(user.id)})"
            >
              Sil
            </button>

          </td>

        `;


        table.appendChild(row);

      }
    );

  }


  /*
   * SİPARİŞLER
   */
  async function loadOrders() {

    const data =
      await apiRequest(
        "/api/admin/orders"
      );


    const orders =
      Array.isArray(data)
        ? data
        : (
            data.orders ||
            data.data ||
            []
          );


    const table =
      document.getElementById(
        "ordersTable"
      );


    table.innerHTML = "";


    if (orders.length === 0) {

      table.innerHTML = `
        <tr>
          <td colspan="9">
            Henüz sipariş yok.
          </td>
        </tr>
      `;

      return;
    }


    orders.forEach(
      function(order) {

        let itemsText = "";


        try {

          const items =
            typeof order.items_json === "string"
              ? JSON.parse(order.items_json)
              : (
                  order.items ||
                  []
                );


          if (Array.isArray(items)) {

            itemsText =
              items
                .map(
                  item =>
                    `${escapeHtml(
                      item.name ||
                      item.title ||
                      "Ürün"
                    )} x${
                      item.quantity ||
                      1
                    }`
                )
                .join("<br>");

          } else {

            itemsText =
              escapeHtml(
                JSON.stringify(items)
              );

          }

        } catch {

          itemsText =
            escapeHtml(
              order.items_json ||
              ""
            );

        }


        const status =
          order.status ||
          "Yeni";


        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(order.id)}
          </td>

          <td>
            ${escapeHtml(
              order.customer_name ||
              order.customerName ||
              ""
            )}
          </td>

          <td>
            ${escapeHtml(
              order.customer_phone ||
              order.customerPhone ||
              ""
            )}
          </td>

          <td>
            ${escapeHtml(
              order.customer_address ||
              order.customerAddress ||
              ""
            )}
          </td>

          <td>
            ${itemsText}
          </td>

          <td>
            ${escapeHtml(
              order.total ||
              0
            )} TL
          </td>

          <td>

            <select
              class="status"
              onchange="changeOrderStatus(
                ${Number(order.id)},
                this.value
              )"
            >

              ${statusOption(
                "Yeni",
                status
              )}

              ${statusOption(
                "Hazırlanıyor",
                status
              )}

              ${statusOption(
                "Kargoda",
                status
              )}

              ${statusOption(
                "Teslim Edildi",
                status
              )}

              ${statusOption(
                "İptal",
                status
              )}

            </select>

          </td>

          <td>
            ${escapeHtml(
              order.created_at ||
              order.createdAt ||
              ""
            )}
          </td>

          <td>

            <button
              class="danger"
              onclick="deleteOrder(${Number(order.id)})"
            >
              Sil
            </button>

          </td>

        `;


        table.appendChild(row);

      }
    );

  }


  /*
   * STATUS OPTION
   */
  function statusOption(
    value,
    current
  ) {

    return `
      <option
        value="${escapeHtml(value)}"
        ${value === current ? "selected" : ""}
      >
        ${escapeHtml(value)}
      </option>
    `;

  }


  /*
   * SQLITE → SUPABASE TAŞIMA
   */
  async function migrateToSupabase() {

    const confirmed =
      confirm(
        "SQLite verilerini Supabase'e aktarmak istediğine emin misin?"
      );


    if (!confirmed) {
      return;
    }


    try {

      showMessage(
        "Veriler Supabase'e aktarılıyor..."
      );


      const data =
        await apiRequest(
          "/api/admin/migrate-to-supabase",
          {
            method: "POST"
          }
        );


      console.log(
        "SUPABASE TAŞIMA SONUCU:",
        data
      );


      showMessage(
        `Taşıma tamamlandı: ${data.users} kullanıcı, ${data.orders} sipariş.`
      );


    } catch (error) {

      console.error(
        "SUPABASE TAŞIMA HATASI:",
        error
      );


      showMessage(
        "Taşıma başarısız: " +
        error.message
      );

    }

  }


  /*
   * KULLANICI SİL
   */
  async function deleteUser(id) {

    const confirmDelete =
      confirm(
        "Bu kullanıcıyı silmek istediğine emin misin?"
      );


    if (!confirmDelete) {
      return;
    }


    try {

      await apiRequest(
        "/api/admin/users/" + id,
        {
          method: "DELETE"
        }
      );


      showMessage(
        "Kullanıcı silindi."
      );


      loadAll();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message
      );

    }

  }


  /*
   * SİPARİŞ DURUMU DEĞİŞTİR
   */
  async function changeOrderStatus(
    id,
    status
  ) {

    try {

      await apiRequest(
        "/api/admin/orders/" +
        id +
        "/status",
        {
          method: "PATCH",
          body: JSON.stringify({
            status
          })
        }
      );


      showMessage(
        "Sipariş durumu güncellendi."
      );


      loadAll();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message
      );

    }

  }


  /*
   * SİPARİŞ SİL
   */
  async function deleteOrder(id) {

    const confirmDelete =
      confirm(
        "Bu siparişi silmek istediğine emin misin?"
      );


    if (!confirmDelete) {
      return;
    }


    try {

      await apiRequest(
        "/api/admin/orders/" + id,
        {
          method: "DELETE"
        }
      );


      showMessage(
        "Sipariş silindi."
      );


      loadAll();

    } catch (error) {

      console.error(error);

      showMessage(
        error.message
      );

    }

  }


  /*
   * SAYFA AÇILDIĞINDA
   */
  window.addEventListener(
    "DOMContentLoaded",
    function() {

      const token =
        localStorage.getItem(
          "veloraAdminToken"
        );


      if (token) {

        showAdminPanel();

      }

    }
  );

</script>

</body>
</html>
